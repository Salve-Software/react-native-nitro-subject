name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: Typecheck, format, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      - name: Format
        run: yarn format:check

      - name: Test
        run: yarn test --ci

      - name: Build
        run: yarn build

      - name: Codegen is up to date
        run: |
          yarn nitrogen
          node post-script.js
          git diff --exit-code -- nitrogen

  ios-native:
    name: iOS native tests (Vision on macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Test
        run: swift test --package-path ios/tests/SubjectDetectorTests
